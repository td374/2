# Exp-Concave label configuration for XJTU-SY
# Based on Kim & Lee 2024 (IET Electronics Letters)
# Tests "slow-then-fast" accelerated degradation hypothesis

# Inherit from base
_base_: base.yaml

data:
  dataset: xjtu_sy
  root: D:/1毕业论文文献，方法/XJTU-SY_Bearing_Datasets/Data/XJTU-SY_Bearing_Datasets.part06/XJTU-SY_Bearing_Datasets
  
  label:
    strategy: exp_concave
    alpha: 2.0  # Curvature parameter (Kim & Lee default)
  
  features:
    use_wavelet_denoise: true
    wavelet: db4
    level: 3
    mrmr_k: 12
  
  window:
    length: 32
    stride: 1

paths:
  data_dir: artifacts/data_exp_concave
  checkpoint_dir: artifacts/checkpoints/exp_concave
  report_dir: artifacts/reports/exp_concave

runtime:
  seeds: [42, 123, 456, 789, 1011]
  device: cuda

train:
  epochs: 150
  batch_size: 128
  optimizer:
    name: adam
    lr: 0.001
  scheduler:
    name: reduce_lr_on_plateau
    patience: 10
    factor: 0.5
  early_stopping:
    patience: 15

experiments:
  single:
    models: [se_resnet_bigru]
