data:
  dataset: xjtu_sy
  root: C:/Users/28129/Desktop/论文改写整理发表？/修改版——1/datasets/XJTU-SY_Bearing_Datasets
  sample_rate: 25600.0
  window_len: 32
  stride: 1
  use_cache: false
  denoise:
    enable: true
    wavelet: db4
    level: 3
    mode: soft
  fft:
    bins: 64
    bin_start: 0
    log_scale: false
  multi_domain:
    source: horizontal
  mrmr:
    enable: true
    k: 12
    n_bins: 10
  label:
    strategy: exp_concave
    alpha: 2.0
paths:
  data_dir: artifacts/data_exp_concave
  report_dir: artifacts/reports/exp_concave
runtime:
  seeds:
  - 42
  - 123
  - 456
  - 789
  - 1011
  device: cuda
model:
  hidden_dim: 64
  num_layers: 2
  dropout: 0.2
  se_reduction: 16
  channel_plan:
  - 64
  - 128
  use_se: true
  mmd_feature: flatten
train:
  epochs: 150
  batch_size: 128
  loss: weighted_mse
  loss_params:
    threshold: 0.3
    weight: 2.0
  val_loss: mse
  patience: 15
  grad_clip: null
  optim:
    lr: 0.001
    weight_decay: 0.0
  scheduler:
    name: reduce_on_plateau
    factor: 0.5
    patience: 5
    min_lr: 1.0e-06
experiments:
  single:
    models:
    - se_resnet_bigru
